[package]
name = "tab-transcriber-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "tab_transcriber_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
audio-capture = { path = "../../../crates/audio-capture" }
dsp-pitch = { path = "../../../crates/dsp-pitch" }
poly-transcriber = { path = "../../../crates/poly-transcriber" }
tab-solver = { path = "../../../crates/tab-solver" }
music-theory = { path = "../../../crates/music-theory" }
stem-separator = { path = "../../../crates/stem-separator" }
